<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney & Marvel 電影刷刷看！✨</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans TC", sans-serif; 
    }

    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      overflow: hidden; 
      position: relative;
    }

    /* 夢幻背景微光光暈 */
    .magic-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.28) 0%, rgba(56, 189, 248, 0.16) 50%, transparent 70%);
      border-radius: 50%;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(45px);
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    /* 彈窗畫面基底 (Login & Instructions) */
    .modal-screen {
      position: absolute;
      z-index: 50;
      width: 320px;
      padding: 32px 24px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .modal-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .modal-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      animation: floatIcon 3s ease-in-out infinite alternate;
    }

    @keyframes floatIcon {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .modal-screen h2 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5f3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .modal-screen p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    .login-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #8b5cf6);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .primary-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* 玩法說明框 */
    .tutorial-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 22px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .tutorial-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .tutorial-item:last-child {
      margin-bottom: 0;
    }

    .tag-recommend {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .tag-not-recommend {
      background: rgba(251, 113, 133, 0.2);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.4);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    /* 遊戲主頁頂部 */
    .header { 
      position: absolute; 
      top: 28px; 
      text-align: center; 
      z-index: 20; 
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .header.active {
      opacity: 1;
      transform: translateY(0);
    }
    .header h1 { 
      font-size: 1.4rem; 
      font-weight: 800; 
      background: linear-gradient(135deg, #a5f3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .card-container { 
      position: relative; 
      width: 320px; 
      height: 480px; 
      perspective: 1000px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .card-container.active {
      opacity: 1;
    }
    
    .card {
      position: absolute; 
      width: 100%; 
      height: 100%; 
      border-radius: 24px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
      user-select: none; 
      touch-action: none; 
      cursor: grab;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    }
    .card:active { cursor: grabbing; }

    /* 圖片/海報區域 */
    .movie-poster-box {
      width: 100%;
      height: 290px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .movie-poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .movie-poster-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.9rem;
      gap: 6px;
    }
    .movie-poster-placeholder span {
      font-size: 2.2rem;
    }

    /* 資訊面板 */
    .card-content {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      background: linear-gradient(180deg, rgba(30,41,59,0) 0%, rgba(15,23,42,0.6) 100%);
    }

    .badge-category { 
      font-size: 0.75rem; 
      font-weight: 700; 
      letter-spacing: 0.8px; 
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.15); 
      padding: 4px 10px; 
      border-radius: 12px; 
      align-self: flex-start; 
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .movie-info { 
      margin-top: 4px;
    }
    .movie-title { 
      font-size: 1.25rem; 
      font-weight: 700; 
      line-height: 1.35; 
      color: #f8fafc; 
    }
    .movie-year { 
      font-size: 0.85rem; 
      color: #94a3b8; 
      margin-top: 3px; 
    }

    /* 滑動徽章 (Stamps) - 推唔推薦 (海報圖片中央置中並放大) */
    .stamp { 
      position: absolute; 
      top: 145px; /* 剛好在 290px 海報垂直正中間 */
      left: 50%;
      font-size: 2.3rem; 
      font-weight: 900; 
      padding: 10px 24px; 
      border-radius: 16px; 
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 30;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.6); /* 半透明深底防反光，任何背景均清楚可見 */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .stamp-like { 
      color: #4ade80; 
      border: 4px solid #4ade80; 
      transform: translate(-50%, -50%) rotate(-8deg); 
      box-shadow: 0 0 25px rgba(74, 222, 128, 0.5), inset 0 0 15px rgba(74, 222, 128, 0.2);
    }
    .stamp-nope { 
      color: #fb7185; 
      border: 4px solid #fb7185; 
      transform: translate(-50%, -50%) rotate(8deg); 
      box-shadow: 0 0 25px rgba(251, 113, 133, 0.5), inset 0 0 15px rgba(251, 113, 133, 0.2);
    }

    /* 底部操作按鈕 */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .controls-wrapper.active {
      opacity: 1;
    }

    .controls { 
      display: flex; 
      gap: 36px; 
    }
    .btn { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      border: 1px solid rgba(255,255,255,0.15); 
      font-size: 1.6rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
      transition: transform 0.15s ease, box-shadow 0.15s ease; 
      backdrop-filter: blur(8px);
    }
    .btn:active { transform: scale(0.9); }
    .btn-nope { 
      background: rgba(239, 68, 68, 0.25); 
      color: #f87171; 
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    .btn-like { 
      background: rgba(34, 197, 94, 0.25); 
      color: #4ade80; 
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
    }

    .swipe-subhint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* 結果結算卡片 */
    .results-card { 
      display: none; 
      width: 335px; 
      max-height: 85vh; 
      background: rgba(30, 41, 59, 0.95); 
      border-radius: 24px; 
      padding: 24px 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.15); 
      overflow-y: auto; 
      text-align: center; 
      z-index: 30;
      backdrop-filter: blur(16px);
    }
    .results-card h2 { 
      font-size: 1.35rem; 
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px; 
    }
    .stats-summary { 
      font-size: 0.95rem; 
      color: #cbd5e1; 
      line-height: 1.4;
    }

    /* Annual Dinner 專屬評語框 */
    .dinner-quote-card {
      margin: 14px 0 16px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: #fbcfe8;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
    }

    .recommend-list { 
      text-align: left; 
      background: #0f172a; 
      padding: 12px 16px; 
      border-radius: 14px; 
      margin-bottom: 18px; 
      max-height: 180px; 
      overflow-y: auto; 
      font-size: 0.85rem; 
      list-style: none;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .recommend-list li { 
      margin-bottom: 6px; 
      color: #7dd3fc; 
      word-break: break-word;
    }
    .share-btn { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      color: white; 
      font-weight: 700; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: opacity 0.2s ease;
    }
    .share-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="magic-glow"></div>

  <!-- 1. 登入頁面 -->
  <div class="modal-screen" id="loginScreen">
    <div class="modal-icon">🏰</div>
    <h2>電影刷刷看</h2>
    <p>踏入迪士尼與漫威嘅神奇世界！<br>先話畀我哋知你叫咩名啦：</p>
    <input type="text" id="usernameInput" class="login-input" placeholder="輸入你的稱呼" maxlength="20">
    <button class="primary-btn" onclick="showTutorial()">下一步 ✨</button>
  </div>

  <!-- 2. 玩法指引頁面 (打完名後彈出) -->
  <div class="modal-screen hidden" id="tutorialScreen" style="display: none;">
    <div class="modal-icon">💡</div>
    <h2 id="tutorialGreeting">點樣玩？</h2>
    <p style="margin-bottom: 14px;">好似玩交友 App 咁輕鬆表態！</p>
    <div class="tutorial-box">
      <div class="tutorial-item">
        <span>👉 <b>向右滑</b> 或撳 <b>♥</b></span>
        <span class="tag-recommend">推薦 ✨</span>
      </div>
      <div class="tutorial-item">
        <span>👈 <b>向左滑</b> 或撳 <b>✕</b></span>
        <span class="tag-not-recommend">唔推薦 💨</span>
      </div>
    </div>
    <button class="primary-btn" onclick="startGame()">明白，即刻開始！🚀</button>
  </div>

  <!-- 3. 刷卡介面 -->
  <div class="header" id="header">
    <h1 id="userHeaderTitle">Disney & Marvel 刷刷看</h1>
  </div>

  <div class="card-container" id="cardContainer"></div>

  <div class="controls-wrapper" id="controls">
    <div class="controls">
      <button class="btn btn-nope" title="唔推薦" onclick="triggerSwipe('left')">✕</button>
      <button class="btn btn-like" title="推薦" onclick="triggerSwipe('right')">♥</button>
    </div>
    <div class="swipe-subhint">👈 唔推薦 ｜ 推薦 👉</div>
  </div>

  <!-- 4. 結果結算頁面 -->
  <div class="results-card" id="resultsCard">
    <h2 id="resultUserTitle">🎉 推介結算</h2>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="dinner-quote-card" id="dinnerQuoteCard"></div>
    <p style="text-align: left; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px;">你推薦嘅名單：</p>
    <ul class="recommend-list" id="recommendList"></ul>
    <button class="share-btn" onclick="copyResults()">複製推介名單分享去 WhatsApp</button>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztB5C4B34TpI7e2Ije4dqZSQO1kHzU2KXNQgwftWw6VxxKhwwsdXOlSRolHTpeSLrf/exec";

    let userName = "";
    let annualComment = "";

    const movies = [
      { title: "白雪公主 (Snow White)", category: "迪士尼經典", year: "1937", image: "./Snow White.jpg" },
      { title: "木偶奇遇記 (Pinocchio)", category: "迪士尼經典", year: "1940", image: "./木偶奇遇記.jpg" },
      { title: "灰姑娘 / 仙履奇緣 (Cinderella)", category: "迪士尼經典", year: "1950", image: "./仙履奇緣.jpg" },
      { title: "小飛俠 (Peter Pan)", category: "迪士尼經典", year: "1953", image: "./小飛俠.jpg" },
      { title: "睡公主 (Sleeping Beauty)", category: "迪士尼經典", year: "1959", image: "./睡公主.jpg" },
      { title: "小美人魚 (The Little Mermaid)", category: "迪士尼經典", year: "1989", image: "./小美人魚.jpg" },
      { title: "美女與野獸 (Beauty and the Beast)", category: "迪士尼經典", year: "1991", image: "./美女與野獸.jpg" },
      { title: "阿拉丁 (Aladdin)", category: "迪士尼經典", year: "1992", image: "./阿拉丁.jpg" },
      { title: "獅子王 (The Lion King)", category: "迪士尼經典", year: "1994", image: "./獅子王.jpg" },
      { title: "花木蘭 (Mulan)", category: "迪士尼經典", year: "1998", image: "./花木蘭.jpg" },

      { title: "魔髮奇緣 (Tangled)", category: "迪士尼動畫", year: "2010", image: "./魔髮奇緣.jpg" },
      { title: "無敵破壞王 (Wreck-It Ralph)", category: "迪士尼動畫", year: "2012", image: "./無敵破壞王.jpg" },
      { title: "冰雪奇緣 (Frozen)", category: "迪士尼動畫", year: "2013", image: "./冰雪奇緣.jpg" },
      { title: "大英雄聯盟 (Big Hero 6)", category: "迪士尼動畫", year: "2014", image: "./大英雄聯盟.jpg" },
      { title: "優獸大都會 (Zootopia)", category: "迪士尼動畫", year: "2016", image: "./優獸大都會.jpg" },
      { title: "海洋奇緣 (Moana)", category: "迪士尼動畫", year: "2016", image: "./海洋奇緣.jpg" },
      { title: "魔法滿屋 (Encanto)", category: "迪士尼動畫", year: "2021", image: "./魔法滿屋.jpg" },

      { title: "反斗奇兵 (Toy Story)", category: "皮克斯 Pixar", year: "1995", image: "./反斗奇兵.jpg" },
      { title: "怪獸公司 (Monsters, Inc.)", category: "皮克斯 Pixar", year: "2001", image: "./怪獸公司.jpg" },
      { title: "海底奇兵 (Finding Nemo)", category: "皮克斯 Pixar", year: "2003", image: "./海底奇兵.jpg" },
      { title: "超人特工隊 (The Incredibles)", category: "皮克斯 Pixar", year: "2004", image: "./超人特工隊.jpg" },
      { title: "反斗車王 (Cars)", category: "皮克斯 Pixar", year: "2006", image: "./反斗車王.jpg" },
      { title: "五星級大鼠 (Ratatouille)", category: "皮克斯 Pixar", year: "2007", image: "./五星級大鼠.jpg" },
      { title: "太空奇兵·威E (WALL-E)", category: "皮克斯 Pixar", year: "2008", image: "./太空奇兵·威E.jpg" },
      { title: "沖天救兵 (Up)", category: "皮克斯 Pixar", year: "2009", image: "./沖天救兵.jpg" },
      { title: "玩轉腦朋友 (Inside Out)", category: "皮克斯 Pixar", year: "2015", image: "./玩轉腦朋友.jpg" },
      { title: "玩轉極樂園 (Coco)", category: "皮克斯 Pixar", year: "2017", image: "./玩轉極樂園.jpg" },
      { title: "靈魂奇遇記 (Soul)", category: "皮克斯 Pixar", year: "2020", image: "./靈魂奇遇記.jpg" },

      { title: "鐵甲奇俠 (Iron Man)", category: "漫威 Marvel", year: "2008", image: "./鐵甲奇俠.jpg" },
      { title: "美國隊長 (Captain America)", category: "漫威 Marvel", year: "2011", image: "./美國隊長.jpg" },
      { title: "雷神 (Thor)", category: "漫威 Marvel", year: "2011", image: "./雷神.jpg" },
      { title: "復仇者聯盟 (The Avengers)", category: "漫威 Marvel", year: "2012", image: "./復仇者聯盟.jpg" },
      { title: "銀河守護隊 (Guardians of the Galaxy)", category: "漫威 Marvel", year: "2014", image: "./銀河守護隊.jpg" },
      { title: "X戰警 (X-Men)", category: "漫威 Marvel", year: "2011", image: "./X戰警.jpg" },
      { title: "蜘蛛俠(Spider-Man)", category: "漫威 Marvel", year: "2002", image: "./蜘蛛俠.jpg" },
      { title: "死侍(Deadpool)", category: "漫威 Marvel", year: "2024", image: "./死侍.jpg" }
    ];

    let currentIndex = 0;
    const recommended = [];
    const notRecommended = [];
    const container = document.getElementById('cardContainer');

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('disney_swiper_username');
      if (savedName) {
        document.getElementById('usernameInput').value = savedName;
      }
    });

    // 步驟 1：輸入稱呼後，跳轉至玩法指引
    function showTutorial() {
      const input = document.getElementById('usernameInput');
      const val = input.value.trim();
      userName = val || "神祕影迷";
      localStorage.setItem('disney_swiper_username', userName);

      document.getElementById('tutorialGreeting').innerText = `哈囉 ${userName}！✨`;

      const loginScreen = document.getElementById('loginScreen');
      loginScreen.classList.add('hidden');

      setTimeout(() => {
        loginScreen.style.display = 'none';
        const tutorialScreen = document.getElementById('tutorialScreen');
        tutorialScreen.style.display = 'flex';
        tutorialScreen.offsetHeight;
        tutorialScreen.classList.remove('hidden');
      }, 350);
    }

    // 步驟 2：睇完指引，正式開始刷卡
    function startGame() {
      document.getElementById('userHeaderTitle').innerText = `✨ ${userName} 的電影推介`;
      document.getElementById('resultUserTitle').innerText = `🎉 ${userName} 的推介清單`;

      const tutorialScreen = document.getElementById('tutorialScreen');
      tutorialScreen.classList.add('hidden');

      setTimeout(() => {
        tutorialScreen.style.display = 'none';
        document.getElementById('header').classList.add('active');
        document.getElementById('cardContainer').classList.add('active');
        document.getElementById('controls').classList.add('active');
      }, 350);
    }

    document.getElementById('usernameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') showTutorial();
    });

    function createCard(movie, index) {
      const card = document.createElement('div');
      card.classList.add('card');
      card.style.zIndex = movies.length - index;

      const posterContent = movie.image 
        ? `<img src="${movie.image}" alt="${movie.title}" onerror="this.parentElement.innerHTML='<div class=\\'movie-poster-placeholder\\'><span>🎬</span><small>圖片載入失敗</small></div>'">` 
        : `<div class="movie-poster-placeholder"><span>✨</span><small>電影海報預留位</small></div>`;

      card.innerHTML = `
        <div class="movie-poster-box">
          ${posterContent}
        </div>
        <div class="card-content">
          <div class="badge-category">${movie.category}</div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-year">${movie.year}</div>
          </div>
        </div>
        <div class="stamp stamp-like">推薦 ✨</div>
        <div class="stamp stamp-nope">唔推薦 💨</div>
      `;

      initDrag(card, movie);
      return card;
    }

    function renderCards() {
      container.innerHTML = '';
      movies.forEach((movie, index) => {
        const card = createCard(movie, index);
        container.appendChild(card);
      });
    }

    function initDrag(card, movie) {
      let startX = 0, currentX = 0, isDragging = false;
      const likeStamp = card.querySelector('.stamp-like');
      const nopeStamp = card.querySelector('.stamp-nope');

      const onStart = (e) => {
        if (card !== container.firstElementChild) return;
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        card.style.transition = 'none';
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        currentX = clientX - startX;
        const rotate = currentX * 0.08;
        card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

        if (currentX > 30) {
          likeStamp.style.opacity = Math.min((currentX - 30) / 70, 1);
          nopeStamp.style.opacity = 0;
        } else if (currentX < -30) {
          nopeStamp.style.opacity = Math.min((-currentX - 30) / 70, 1);
          likeStamp.style.opacity = 0;
        } else {
          likeStamp.style.opacity = 0;
          nopeStamp.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;

        if (currentX > 90) {
          finishSwipe(card, 'right', movie);
        } else if (currentX < -90) {
          finishSwipe(card, 'left', movie);
        } else {
          card.style.transition = 'transform 0.3s ease';
          card.style.transform = 'translateX(0px) rotate(0deg)';
          likeStamp.style.opacity = 0;
          nopeStamp.style.opacity = 0;
        }
        currentX = 0;
      };

      card.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      card.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);
    }

    function triggerSwipe(direction) {
      const topCard = container.querySelector('.card');
      if (!topCard || currentIndex >= movies.length) return;
      finishSwipe(topCard, direction, movies[currentIndex]);
    }

    function finishSwipe(card, direction, movie) {
      card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease';
      
      const likeStamp = card.querySelector('.stamp-like');
      const nopeStamp = card.querySelector('.stamp-nope');

      if (direction === 'right') {
        card.style.transform = 'translateX(550px) rotate(35deg)';
        if (likeStamp) likeStamp.style.opacity = '1';
        recommended.push(movie);
      } else {
        card.style.transform = 'translateX(-550px) rotate(-35deg)';
        if (nopeStamp) nopeStamp.style.opacity = '1';
        notRecommended.push(movie);
      }
      card.style.opacity = '0';

      setTimeout(() => {
        card.remove();
      }, 300);

      currentIndex++;
      if (currentIndex >= movies.length) {
        setTimeout(showResults, 350);
      }
    }

    function getAnnualDinnerComment(percentage) {
      if (percentage >= 90) {
        return "嘩嘩嘩~全部都係你心水！Annual Dinner Team需要你！";
      } else if (percentage >= 70) {
        return "睇嚟你超有眼光, 迪士尼Annual Dinner 打扮有咩諗法呀??";
      } else if (percentage >= 40) {
        return "你推介咗好多正片, 好期望喺Annual Dinner見到你✨";
      } else if (percentage >= 20) {
        return "口味幾獨特喎！嚟緊留意我哋Annual Team嘅活動啦！";
      } else {
        return "咁多套都唔啱心水？今個Weekend再發掘下新片啦 🍿";
      }
    }

    function showResults() {
      document.getElementById('header').style.display = 'none';
      document.getElementById('cardContainer').style.display = 'none';
      document.getElementById('controls').style.display = 'none';

      const resultsCard = document.getElementById('resultsCard');
      resultsCard.style.display = 'block';

      const percentage = Math.round((recommended.length / movies.length) * 100);
      annualComment = getAnnualDinnerComment(percentage);

      document.getElementById('statsSummary').innerHTML = 
        `玩家 <strong>${userName}</strong> 在 ${movies.length} 套電影中，<br>推薦咗 <strong style="color:#4ade80; font-size:1.25rem;">${recommended.length}</strong> 套！<br>` +
        `<span style="font-size:0.85rem; color:#94a3b8;">心水推薦率：${percentage}%</span>`;

      document.getElementById('dinnerQuoteCard').innerText = annualComment;

      const list = document.getElementById('recommendList');
      if (recommended.length === 0) {
        list.innerHTML = '<li>你暫時一套都無推薦～</li>';
      } else {
        list.innerHTML = recommended.map(m => `<li>✨ ${m.title}</li>`).join('');
      }

      if (GOOGLE_SCRIPT_URL) {
        const payload = {
          userName: userName,
          recommendedCount: recommended.length,
          watchedCount: recommended.length,
          totalCount: movies.length,
          percentage: percentage,
          annualComment: annualComment,
          recommendedList: recommended.map(m => m.title),
          watchedList: recommended.map(m => m.title)
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(err => console.log("上報失敗:", err));
      }
    }

    function copyResults() {
      const percentage = Math.round((recommended.length / movies.length) * 100);
      const text = `🎬 【${userName}】嘅 Disney & Marvel 電影推介戰績：\n` +
        `我推薦咗 ${recommended.length} / ${movies.length} 套 (${percentage}%)！\n\n` +
        `📣 Annual Team 評價：\n「${annualComment}」\n\n` +
        `👍 我嘅推薦名單：\n` + 
        recommended.map(m => `• ${m.title}`).join('\n');
      
      navigator.clipboard.writeText(text).then(() => {
        alert('已複製個人推介戰績與評語！快點貼到 WhatsApp 分享啦～ ✨');
      });
    }

    renderCards();
  </script>
</body>
</html>
