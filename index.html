    <script>
        // Stars canvas background
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 8000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.01 + 0.005
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 230, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();

                female: { title: "梅莉達 Merida", avatar: "🤠", img: "ESTP-G.png", power: "極速閃避與精準獵捕", traits: "勇敢無畏、適應力極強、自信帥氣" },

                female: { title: "茱莉公主", avatar: "💃", img: "ESFP-G.jpg", power: "魅惑舞步與情緒感染", traits: "活潑熱情、熱愛社交、生活多姿多彩" },
                companion: "巴斯光年 / 木蘭",
                advice: "注意熱鬧背後的長期規劃，學會享受安靜的獨處。"
            }

        let currentQuestionIndex = 0;
        let userAnswers = {
            E: 0, I: 0,
            S: 0, N: 0,
            T: 0, F: 0,
            J: 0, P: 0
        };

        function startQuiz() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            userAnswers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const total = questions.length;
            const progress = Math.round(((currentQuestionIndex + 1) / total) * 100);

            document.getElementById('question-number').innerText = `問題 ${currentQuestionIndex + 1} / ${total}`;
            document.getElementById('progress-percent').innerText = `${progress}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-category').innerText = '';
            document.getElementById('question-text').innerText = q.title;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'glass-card w-full text-left p-4 rounded-2xl flex items-center justify-between group transition-all text-sm sm:text-base';
                btn.innerHTML = `
                    <span class="font-medium text-purple-100 group-hover:text-amber-200 transition">${opt.text}</span>
                    <i class="fa-solid fa-chevron-right text-purple-400 group-hover:text-amber-300 transform group-hover:translate-x-1 transition text-xs"></i>
                `;
                btn.onclick = () => selectOption(opt);
                container.appendChild(btn);
            });
        }

        function selectOption(option) {
            userAnswers[option.dimension]++;
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                calculateAndShowResult();
            }
        }

        function applyCharacterImage(imgElemId, avatarElemId, imgSrc, fallbackAvatar) {
            const imgElem = document.getElementById(imgElemId);
            const avatarElem = document.getElementById(avatarElemId);

            avatarElem.innerText = fallbackAvatar;

            if (imgSrc && imgSrc.trim() !== "") {
                imgElem.src = imgSrc;
                imgElem.onload = () => {
                    imgElem.classList.remove('hidden');
                    avatarElem.classList.add('hidden');
                };
                imgElem.onerror = () => {
                    imgElem.classList.add('hidden');
                    avatarElem.classList.remove('hidden');
                };
            } else {
                imgElem.classList.add('hidden');
                avatarElem.classList.remove('hidden');
            }
        }

        function calculateAndShowResult() {
            const traitKey = [
                userAnswers.E >= userAnswers.I ? 'E' : 'I',
                userAnswers.S >= userAnswers.N ? 'S' : 'N',
                userAnswers.T >= userAnswers.F ? 'T' : 'F',
                userAnswers.J >= userAnswers.P ? 'J' : 'P'
            ].join('');

            const data = archetypes[traitKey];
            if (!data) {
                alert("計算結果出錯，請重新測試！");
                restartQuiz();
                return;
            }

            applyCharacterImage('res-male-img', 'res-male-avatar', data.male.img, data.male.avatar);
            document.getElementById('res-male-title').innerText = data.male.title;
            document.getElementById('res-male-power').innerText = data.male.power;
            document.getElementById('res-male-traits').innerText = data.male.traits;

            applyCharacterImage('res-female-img', 'res-female-avatar', data.female.img, data.female.avatar);
            document.getElementById('res-female-title').innerText = data.female.title;
            document.getElementById('res-female-power').innerText = data.female.power;
            document.getElementById('res-female-traits').innerText = data.female.traits;

            document.getElementById('res-best-companion').innerText = data.companion;
            document.getElementById('res-advice').innerText = data.advice;

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shareResult() {
            const male = document.getElementById('res-male-title').innerText;
            const female = document.getElementById('res-female-title').innerText;

            const textToCopy = `✨ 迪士尼人物冒險測驗 ✨\n我嘅靈魂角色係【${male}】同【${female}】！快啲嚟測下屬於你嘅角色啦！`;

            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast("結果已複製到剪貼簿！可以貼俾朋友睇啦！");
            } catch (err) {
                showToast("複製失敗，請手動截圖分享～");
            }
            document.body.removeChild(tempInput);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
