<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney & Marvel 電影刷刷看！✨</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans TC", sans-serif; 
    }

    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      overflow: hidden; 
      position: relative;
    }

    /* 夢幻背景微光光暈 */
    .magic-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.28) 0%, rgba(56, 189, 248, 0.16) 50%, transparent 70%);
      border-radius: 50%;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(45px);
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    /* 彈窗畫面基底 (Login & Instructions) */
    .modal-screen {
      position: absolute;
      z-index: 50;
      width: 320px;
      padding: 32px 24px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .modal-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .modal-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      animation: floatIcon 3s ease-in-out infinite alternate;
    }

    @keyframes floatIcon {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .modal-screen h2 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5f3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .modal-screen p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    .login-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #8b5cf6);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .primary-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* 玩法說明框 */
    .tutorial-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 22px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .tutorial-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .tutorial-item:last-child {
      margin-bottom: 0;
    }

    .tag-recommend {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .tag-not-recommend {
      background: rgba(251, 113, 133, 0.2);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.4);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .header { 
      position: absolute; 
      top: 28px; 
      text-align: center; 
      z-index: 20; 
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
