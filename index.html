<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disney 心水配對 ✨</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans TC", sans-serif; 
    }

    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh;
      min-height: 100dvh; /* 防止手機網址列縮放時裁切到按鈕 */
      overflow: hidden; 
      position: relative;
    }

    /* 夢幻背景微光光暈 */
    .magic-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.28) 0%, rgba(56, 189, 248, 0.16) 50%, transparent 70%);
      border-radius: 50%;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(45px);
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    /* 彈窗畫面基底 */
    .modal-screen {
      position: absolute;
      z-index: 50;
      width: 320px;
      padding: 30px 22px;
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .modal-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .modal-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      animation: floatIcon 3s ease-in-out infinite alternate;
    }

    @keyframes floatIcon {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .modal-screen h2 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5f3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f472b6;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .tutorial-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .modal-screen p {
      font-size: 0.86rem;
      color: #94a3b8;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .login-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    .login-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .login-input.error {
      border-color: #fb7185;
      box-shadow: 0 0 14px rgba(251, 113, 133, 0.45);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .name-error-msg {
      display: none;
      color: #fb7185;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: -12px;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7, #8b5cf6);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      font-size: 0.98rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .primary-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* 玩法說明框 */
    .tutorial-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 14px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .tutorial-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tutorial-item:last-child {
      margin-bottom: 0;
    }

    .tag-recommend {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .tag-not-recommend {
      background: rgba(251, 113, 133, 0.2);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.4);
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* 遊戲主頁頂部 */
    .header { 
      position: absolute; 
      top: 24px; 
      text-align: center; 
      z-index: 20; 
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .header.active {
      opacity: 1;
      transform: translateY(0);
    }
    .header h1 { 
      font-size: 1.35rem; 
      font-weight: 800; 
      background: linear-gradient(135deg, #a5f3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .card-container { 
      position: relative; 
      width: 320px; 
      height: 480px; 
      perspective: 1000px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .card-container.active {
      opacity: 1;
    }
    
    .card {
      position: absolute; 
      width: 100%; 
      height: 100%; 
      border-radius: 24px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
      user-select: none; 
      touch-action: none; 
      cursor: grab;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    }
    .card:active { cursor: grabbing; }

    /* 圖片/海報區域 */
    .movie-poster-box {
      width: 100%;
      height: 290px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .movie-poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .movie-poster-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.9rem;
      gap: 6px;
    }
    .movie-poster-placeholder span {
      font-size: 2.2rem;
    }

    /* 資訊面板 */
    .card-content {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      background: linear-gradient(180deg, rgba(30,41,59,0) 0%, rgba(15,23,42,0.6) 100%);
    }

    .badge-category { 
      font-size: 0.75rem; 
      font-weight: 700; 
      letter-spacing: 0.8px; 
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.15); 
      padding: 4px 10px; 
      border-radius: 12px; 
      align-self: flex-start; 
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .movie-info { 
      margin-top: 4px;
    }
    .movie-title { 
      font-size: 1.25rem; 
      font-weight: 700; 
      line-height: 1.35; 
      color: #f8fafc; 
    }
    .movie-year { 
      font-size: 0.85rem; 
      color: #94a3b8; 
      margin-top: 3px; 
    }

    /* 滑動徽章 (Stamps) */
    .stamp { 
      position: absolute; 
      top: 145px;
      left: 50%;
      font-size: 1.75rem; 
      font-weight: 900; 
      padding: 8px 18px; 
      border-radius: 16px; 
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 30;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .stamp-like { 
      color: #4ade80; 
      border: 4px solid #4ade80; 
      transform: translate(-50%, -50%) rotate(-8deg); 
      box-shadow: 0 0 25px rgba(74, 222, 128, 0.5), inset 0 0 15px rgba(74, 222, 128, 0.2);
    }
    .stamp-nope { 
      color: #fb7185; 
      border: 4px solid #fb7185; 
      transform: translate(-50%, -50%) rotate(8deg); 
      box-shadow: 0 0 25px rgba(251, 113, 133, 0.5), inset 0 0 15px rgba(251, 113, 133, 0.2);
    }

    /* 底部操作按鈕 */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 18px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .controls-wrapper.active {
      opacity: 1;
    }

    .controls { 
      display: flex; 
      gap: 36px; 
    }
    .btn { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      border: 1px solid rgba(255,255,255,0.15); 
      font-size: 1.5rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
      transition: transform 0.15s ease, box-shadow 0.15s ease; 
      backdrop-filter: blur(8px);
    }
    .btn:active { transform: scale(0.9); }
    .btn-nope { 
      background: rgba(239, 68, 68, 0.25); 
      color: #f87171; 
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    .btn-like { 
      background: rgba(34, 197, 94, 0.25); 
      color: #4ade80; 
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
    }

    .swipe-subhint {
      font-size: 0.76rem;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* 結果結算卡片 */
    .results-card { 
      display: none; 
      width: 335px; 
      max-height: 86vh; 
      background: rgba(30, 41, 59, 0.95); 
      border-radius: 24px; 
      padding: 22px 18px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.15); 
      overflow-y: auto; 
      text-align: center; 
      z-index: 30;
      backdrop-filter: blur(16px);
    }
    .results-card h2 { 
      font-size: 1.35rem; 
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px; 
    }
    .stats-summary { 
      font-size: 0.92rem; 
      color: #cbd5e1; 
      line-height: 1.4;
    }

    .dinner-quote-card {
      margin: 12px 0 14px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: #fbcfe8;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
    }

    .pick-instruction-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .recommend-list { 
      text-align: left; 
      background: #0f172a; 
      padding: 10px 12px; 
      border-radius: 14px; 
      margin-bottom: 16px; 
      max-height: 195px; 
      overflow-y: auto; 
      border: 1px solid rgba(255,255,255,0.06);
    }

    .pick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 0.84rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .pick-item:last-child {
      margin-bottom: 0;
    }
    .pick-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .pick-item input[type="checkbox"] {
      accent-color: #38bdf8;
      width: 17px;
      height: 17px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pick-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn { 
      width: 100%; 
      padding: 13px; 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      color: white; 
      font-weight: 700; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: opacity 0.2s ease;
    }
    .share-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="magic-glow"></div>

  <!-- 1. Page 1：登入畫面 (必填稱呼) -->
  <div class="modal-screen" id="loginScreen">
    <div class="modal-icon">🏰</div>
    <h2>Disney 心水配對</h2>
    <div class="modal-subtitle">推薦大測試</div>
    <p>測試一下你對 Disney 世界有幾熟！<br>你會推薦邊啲作品畀老友睇？<br><span style="font-size:0.8rem; color:#94a3b8; display:inline-block; margin-top:8px;">先話畀我哋知你叫咩名啦：</span></p>
    <input type="text" id="usernameInput" class="login-input" placeholder="輸入你的稱呼 (必須輸入)" maxlength="20">
    <div class="name-error-msg" id="nameErrorMsg">請先輸入稱呼先可以開始玩呀！✨</div>
    <button class="primary-btn" onclick="showTutorial()">下一步 ✨</button>
  </div>

  <!-- 2. Page 2：玩法指引畫面 -->
  <div class="modal-screen hidden" id="tutorialScreen" style="display: none;">
    <div class="modal-icon">💡</div>
    <div class="tutorial-badge">【玩法說明】</div>
    <h2 id="tutorialGreeting">準備好未？✨</h2>
    <p style="margin-bottom: 14px;">好似玩交友 App 咁輕鬆表態！</p>
    <div class="tutorial-box">
      <div class="tutorial-item">
        <div>
          👉 <b>會推薦畀老友睇</b><br>
          <small style="color:#94a3b8;">（向右滑，或者按 ♥️「推薦！」）</small>
        </div>
        <span class="tag-recommend">推薦！</span>
      </div>
      <div class="tutorial-item">
        <div>
          👈 <b>覺得一般，或者未睇過</b><br>
          <small style="color:#94a3b8;">（向左滑，或者按 ✕「一般／未睇過」）</small>
        </div>
        <span class="tag-not-recommend">一般／未睇過</span>
      </div>
    </div>
    <button class="primary-btn" onclick="startGame()">明白，即刻開始！🚀</button>
  </div>

  <!-- 3. 刷卡介面 -->
  <div class="header" id="header">
    <h1 id="userHeaderTitle">Disney 心水配對</h1>
  </div>

  <div class="card-container" id="cardContainer"></div>

  <div class="controls-wrapper" id="controls">
    <div class="controls">
      <button class="btn btn-nope" title="一般／未睇過" onclick="triggerSwipe('left')">✕</button>
      <button class="btn btn-like" title="推薦！" onclick="triggerSwipe('right')">♥</button>
    </div>
    <div class="swipe-subhint">👈 一般／未睇過 ｜ 推薦！ 👉</div>
  </div>

  <!-- 4. 結果結算頁面 -->
  <div class="results-card" id="resultsCard">
    <h2 id="resultUserTitle">🎉 心水推介清單</h2>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="dinner-quote-card" id="dinnerQuoteCard"></div>
    
    <div class="pick-instruction-header">
      <span>精選推介分享落 WhatsApp：</span>
      <span style="color: #38bdf8; font-weight:700;" id="pickCounterText">已選 0/5 套</span>
    </div>
    <div class="recommend-list" id="recommendList"></div>
    
    <button class="share-btn" onclick="copyResults()">複製精選推介分享去 WhatsApp</button>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztB5C4B34TpI7e2Ije4dqZSQO1kHzU2KXNQgwftWw6VxxKhwwsdXOlSRolHTpeSLrf/exec";

    let userName = "";
    let annualComment = "";
    let isSwiping = false; // 防連點、防跳卡動畫鎖

    const movies = [
      { title: "白雪公主 (Snow White)", category: "迪士尼經典", year: "1937", image: "./Snow White.jpg" },

      { title: "反斗奇兵 (Toy Story)", category: "皮克斯 Pixar", year: "1995", image: "./反斗奇兵.jpg" },
      { title: "怪獸公司 (Monsters, Inc.)", category: "皮克斯 Pixar", year: "2001", image: "./怪獸公司.jpg" },

      { title: "超人特工隊 (The Incredibles)", category: "皮克斯 Pixar", year: "2004", image: "./超人特工隊.jpg" },
      { title: "反斗車王 (Cars)", category: "皮克斯 Pixar", year: "2006", image: "./反斗車王.jpg" },
      { title: "五星級大鼠 (Ratatouille)", category: "皮克斯 Pixar", year: "2007", image: "./五星級大鼠.jpg" },
      { title: "太空奇兵·威E (WALL-E)", category: "皮克斯 Pixar", year: "2008", image: "./太空奇兵·威E.jpg" },
      { title: "沖天救兵 (Up)", category: "皮克斯 Pixar", year: "2009", image: "./沖天救兵.jpg" },
      { title: "玩轉腦朋友 (Inside Out)", category: "皮克斯 Pixar", year: "2015", image: "./玩轉腦朋友.jpg" },
      { title: "玩轉極樂園 (Coco)", category: "皮克斯 Pixar", year: "2017", image: "./玩轉極樂園.jpg" },
      { title: "靈魂奇遇記 (Soul)", category: "皮克斯 Pixar", year: "2020", image: "./靈魂奇遇記.jpg" },

      { title: "鐵甲奇俠 (Iron Man)", category: "漫威 Marvel", year: "2008", image: "./鐵甲奇俠.jpg" },
      { title: "美國隊長 (Captain America)", category: "漫威 Marvel", year: "2011", image: "./美國隊長.jpg" },
      { title: "雷神 (Thor)", category: "漫威 Marvel", year: "2011", image: "./雷神.jpg" },
      { title: "復仇者聯盟 (The Avengers)", category: "漫威 Marvel", year: "2012", image: "./復仇者聯盟.jpg" },
      { title: "銀河守護隊 (Guardians of the Galaxy)", category: "漫威 Marvel", year: "2014", image: "./銀河守護隊.jpg" },
      { title: "X戰警 (X-Men)", category: "漫威 Marvel", year: "2011", image: "./X戰警.jpg" },
      { title: "蜘蛛俠(Spider-Man)", category: "漫威 Marvel", year: "2002", image: "./蜘蛛俠.jpg" },
      { title: "死侍(Deadpool)", category: "漫威 Marvel", year: "2024", image: "./死侍.jpg" }
    ];

    let currentIndex = 0;
    const recommended = [];
    const notRecommended = [];
    const container = document.getElementById('cardContainer');

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('disney_swiper_username');
      if (savedName) {
        document.getElementById('usernameInput').value = savedName;
      }
    });

    // 監聽用戶輸入，動態清除紅色提示
    document.getElementById('usernameInput').addEventListener('input', () => {
      document.getElementById('nameErrorMsg').style.display = 'none';
      document.getElementById('usernameInput').classList.remove('error');
    });

    // 支援中文輸入法選字 Enter 防誤觸
    document.getElementById('usernameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        showTutorial();
      }
    });

    function showTutorial() {
      const input = document.getElementById('usernameInput');
      const errorMsg = document.getElementById('nameErrorMsg');
      const val = input.value.trim();

      if (!val) {
        input.classList.remove('error');
        void input.offsetWidth; // 重置動畫
        input.classList.add('error');
        errorMsg.style.display = 'block';
        input.focus();
        return;
      }

      errorMsg.style.display = 'none';
      input.classList.remove('error');
      userName = val;
      localStorage.setItem('disney_swiper_username', userName);

      document.getElementById('tutorialGreeting').innerText = `準備好未，${userName}？✨`;

      const loginScreen = document.getElementById('loginScreen');
      loginScreen.classList.add('hidden');

      setTimeout(() => {
        loginScreen.style.display = 'none';
        const tutorialScreen = document.getElementById('tutorialScreen');
        tutorialScreen.style.display = 'flex';
        tutorialScreen.offsetHeight;
        tutorialScreen.classList.remove('hidden');
      }, 350);
    }

    function startGame() {
      document.getElementById('userHeaderTitle').innerText = `✨ ${userName} 的 Disney 心水配對`;
      document.getElementById('resultUserTitle').innerText = `🎉 ${userName} 的心水推介`;

      const tutorialScreen = document.getElementById('tutorialScreen');
      tutorialScreen.classList.add('hidden');

      setTimeout(() => {
        tutorialScreen.style.display = 'none';
        document.getElementById('header').classList.add('active');
        document.getElementById('cardContainer').classList.add('active');
        document.getElementById('controls').classList.add('active');
      }, 350);
    }

    function createCard(movie, index) {
      const card = document.createElement('div');
      card.classList.add('card');
      card.style.zIndex = movies.length - index;

      const posterContent = movie.image 
        ? `<img src="${movie.image}" alt="${movie.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="movie-poster-placeholder" style="display:none;"><span>🎬</span><small>圖片載入失敗</small></div>` 
        : `<div class="movie-poster-placeholder"><span>✨</span><small>電影海報預留位</small></div>`;

      card.innerHTML = `
        <div class="movie-poster-box">
          ${posterContent}
        </div>
        <div class="card-content">
          <div class="badge-category">${movie.category}</div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-year">${movie.year}</div>
          </div>
        </div>
        <div class="stamp stamp-like">推薦！♥️</div>
        <div class="stamp stamp-nope">一般／未睇過</div>
      `;

      initDrag(card, movie);
      return card;
    }

    function renderCards() {
      container.innerHTML = '';
      movies.forEach((movie, index) => {
        const card = createCard(movie, index);
        container.appendChild(card);
      });
    }

    // 修復效能：僅在按住卡片時綁定 Move/End 監聽器，放手即銷毀
    function initDrag(card, movie) {
      let startX = 0, currentX = 0, isDragging = false;
      const likeStamp = card.querySelector('.stamp-like');
      const nopeStamp = card.querySelector('.stamp-nope');

      const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        currentX = clientX - startX;
        const rotate = currentX * 0.08;
        card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

        if (currentX > 30) {
          likeStamp.style.opacity = Math.min((currentX - 30) / 70, 1);
          nopeStamp.style.opacity = 0;
        } else if (currentX < -30) {
          nopeStamp.style.opacity = Math.min((-currentX - 30) / 70, 1);
          likeStamp.style.opacity = 0;
        } else {
          likeStamp.style.opacity = 0;
          nopeStamp.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;

        // 移除 window 臨時監聽
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);

        if (currentX > 90) {
          finishSwipe(card, 'right', movie);
        } else if (currentX < -90) {
          finishSwipe(card, 'left', movie);
        } else {
          card.style.transition = 'transform 0.3s ease';
          card.style.transform = 'translateX(0px) rotate(0deg)';
          likeStamp.style.opacity = 0;
          nopeStamp.style.opacity = 0;
        }
        currentX = 0;
      };

      const onStart = (e) => {
        if (isSwiping || card !== container.firstElementChild) return;
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        card.style.transition = 'none';

        // 動態掛載全域滑動
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
      };

      card.addEventListener('mousedown', onStart);
      card.addEventListener('touchstart', onStart, { passive: true });
    }

    function triggerSwipe(direction) {
      if (isSwiping || currentIndex >= movies.length) return;
      const topCard = container.firstElementChild;
      if (!topCard) return;
      finishSwipe(topCard, direction, movies[currentIndex]);
    }

    function finishSwipe(card, direction, movie) {
      if (isSwiping) return;
      isSwiping = true;

      // 飛出時禁用事件，防止二次誤觸
      card.style.pointerEvents = 'none';
      card.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease';
      
      const likeStamp = card.querySelector('.stamp-like');
      const nopeStamp = card.querySelector('.stamp-nope');

      if (direction === 'right') {
        card.style.transform = 'translateX(550px) rotate(35deg)';
        if (likeStamp) likeStamp.style.opacity = '1';
        recommended.push(movie);
      } else {
        card.style.transform = 'translateX(-550px) rotate(-35deg)';
        if (nopeStamp) nopeStamp.style.opacity = '1';
        notRecommended.push(movie);
      }
      card.style.opacity = '0';

      setTimeout(() => {
        card.remove();
        currentIndex++;
        isSwiping = false; // 解除動畫鎖

        if (currentIndex >= movies.length) {
          showResults();
        }
      }, 300);
    }

    function getAnnualDinnerComment(percentage) {
      if (percentage >= 90) {
        return "嘩嘩嘩~全部都係你心水！Annual Dinner Team需要你！";
      } else if (percentage >= 70) {
        return "睇嚟你超有眼光, 迪士尼Annual Dinner 打扮有咩諗法呀??";
      } else if (percentage >= 40) {
        return "你推介咗好多正片, 好期望喺Annual Dinner見到你✨";
      } else if (percentage >= 20) {
        return "口味幾獨特喎！嚟緊留意我哋Annual Team嘅活動啦！";
      } else {
        return "咁多套都唔啱心水？今個Weekend再發掘下新片啦 🍿";
      }
    }

    function handlePickChange(checkbox) {
      const checkedBoxes = document.querySelectorAll('input[name="pickedMovie"]:checked');
      if (checkedBoxes.length > 5) {
        checkbox.checked = false;
        alert('最多只可以剔選 5 套電影推介落 WhatsApp 清單呀！');
        return;
      }
      updatePickCounter();
    }

    function updatePickCounter() {
      const count = document.querySelectorAll('input[name="pickedMovie"]:checked').length;
      document.getElementById('pickCounterText').innerText = `已選 ${count}/5 套`;
    }

    function showResults() {
      document.getElementById('header').style.display = 'none';
      document.getElementById('cardContainer').style.display = 'none';
      document.getElementById('controls').style.display = 'none';

      const resultsCard = document.getElementById('resultsCard');
      resultsCard.style.display = 'block';

      const percentage = Math.round((recommended.length / movies.length) * 100);
      annualComment = getAnnualDinnerComment(percentage);

      document.getElementById('statsSummary').innerHTML = 
        `玩家 <strong>${userName}</strong> 在 ${movies.length} 套電影中，<br>推薦咗 <strong style="color:#4ade80; font-size:1.25rem;">${recommended.length}</strong> 套！<br>` +
        `<span style="font-size:0.85rem; color:#94a3b8;">心水推薦率：${percentage}%</span>`;

      document.getElementById('dinnerQuoteCard').innerText = annualComment;

      const listContainer = document.getElementById('recommendList');
      if (recommended.length === 0) {
        listContainer.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; padding:8px 0;">你暫時未有推薦嘅作品～</div>';
        document.getElementById('pickCounterText').innerText = '已選 0/5 套';
      } else {
        listContainer.innerHTML = recommended.map((m, idx) => `
          <label class="pick-item">
            <input type="checkbox" name="pickedMovie" value="${m.title}" ${idx < 5 ? 'checked' : ''} onchange="handlePickChange(this)">
            <span>✨ ${m.title}</span>
          </label>
        `).join('');
        updatePickCounter();
      }

      if (GOOGLE_SCRIPT_URL) {
        const payload = {
          userName: userName,
          recommendedCount: recommended.length,
          watchedCount: recommended.length,
          totalCount: movies.length,
          percentage: percentage,
          annualComment: annualComment,
          recommendedList: recommended.map(m => m.title),
          watchedList: recommended.map(m => m.title)
        };

        // 使用 text/plain 避免觸發 Apps Script CORS 預檢失敗
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).catch(err => console.log("上報失敗:", err));
      }
    }

    function copyResults() {
      const percentage = Math.round((recommended.length / movies.length) * 100);
      const checkedBoxes = document.querySelectorAll('input[name="pickedMovie"]:checked');
      const pickedTitles = Array.from(checkedBoxes).map(cb => cb.value);

      let pickedListText = "";
      let titleHeader = "🌟 我精選推薦嘅心水神作：";
      
      if (pickedTitles.length > 0) {
        titleHeader = `🌟 我精選推薦嘅 ${pickedTitles.length} 套神作：`;
        pickedListText = pickedTitles.map((t, idx) => `${idx + 1}. ${t}`).join('\n');
      } else {
        pickedListText = "（暫未剔選心水推薦）";
      }

      const text = `🎬 【${userName}】嘅 Disney 心水配對戰績：\n` +
        `推薦咗 ${recommended.length} / ${movies.length} 套 (${percentage}%)！\n\n` +
        `📣 Annual Team 評價：\n「${annualComment}」\n\n` +
        `${titleHeader}\n` + 
        pickedListText;
      
      navigator.clipboard.writeText(text).then(() => {
        alert('已複製精選推介與戰績！快點貼到 WhatsApp 分享啦～ ✨');
      }).catch(() => {
        alert('複製失敗，請手動複製結果。');
      });
    }

    renderCards();
  </script>
</body>
</html>
